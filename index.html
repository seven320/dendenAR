<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>DENDEN AR</title>
    <!-- A-Frame / AR.js (AR.js 3.4.8 が推奨する A-Frame 1.6.0 に合わせる)。同じ CDN から読んで接続を使い回す -->
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-v1.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.8/aframe/build/aframe-ar.js"></script>
    <!-- シーンの初期化前にコンポーネントを登録するため head で読み込む -->
    <script src="main.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      #status {
        position: fixed;
        left: 50%;
        bottom: 32px;
        z-index: 10;
        transform: translateX(-50%);
        padding: 10px 20px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font: 14px/1.4 system-ui, sans-serif;
        white-space: nowrap;
        pointer-events: none;
        transition: opacity 0.3s;
      }
      #status.hidden { opacity: 0; }
    </style>
  </head>

  <body>
    <div id="status">カメラを起動しています…</div>
    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false; patternRatio: 0.8; maxDetectionRate: 30;"
      renderer="logarithmicDepthBuffer: true; precision: medium;"
      vr-mode-ui="enabled: false"
      cursor="rayOrigin: mouse; fuse: false"
      raycaster="objects: .clickable; interval: 100"
    >
      <a-assets>
        <img id="icon" src="assets/images/icon.webp" />
        <img id="name" src="assets/images/name.png" />
        <img id="twitter" src="assets/images/twitter.png" />
        <img id="github" src="assets/images/github.png" />
        <img id="blog" src="assets/images/blog.png" />
        <img id="instagram" src="assets/images/instagram.png" />
        <img id="profile" src="assets/images/profile.png" />
      </a-assets>

      <!-- smooth-*: 追従のブレを抑える / ar-feedback: 検出時の演出と状態表示 -->
      <a-marker
        type="pattern"
        url="assets/qrcode/mycard_denden.patt"
        smooth="true"
        smooth-count="5"
        smooth-tolerance="0.01"
        smooth-threshold="5"
        ar-feedback="content: #card; status: #status"
      >
        <a-entity
          id="card"
          rotation="10 10 0"
          animation__reveal="property: scale; from: 0.01 0.01 0.01; to: 1 1 1; dur: 500; easing: easeOutBack; startEvents: reveal"
        >
          <a-circle position="0 0.1 0" rotation="-90 0 0" radius="0.8" src="#icon"></a-circle>
          <a-image
            src="#name"
            position="0 0.01 1"
            rotation="-90 0 0"
            width="1"
            height="0.5"
            opacity="0.8"
          ></a-image>
          <a-entity
            position="0 -0.01 0"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 30000; easing: linear"
            link-ring="radius: 1.6"
          ></a-entity>
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
